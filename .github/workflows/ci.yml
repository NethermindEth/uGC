name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address, undefined]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure
        run: |
          if [ "${{ matrix.sanitizer }}" != "none" ]; then
            export CFLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-sanitize-recover=all -g"
            export LDFLAGS="-fsanitize=${{ matrix.sanitizer }}"
          fi
          cmake -S . -B build-tests -DUGC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-tests

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  formal-verification:
    name: Formal verification (Frama-C)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull Frama-C image
        run: docker pull framac/frama-c:30.0

      - name: Run WP + Eva
        run: |
          chmod +x formal/verify.sh
          docker run --rm -v "$PWD":/work -w /work framac/frama-c:30.0 \
            ./formal/verify.sh

  build:
    name: Cross-build (riscv64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker
        run: |
          chmod +x build.sh
          ./build.sh docker

      - name: Verify build artifacts
        run: |
          if [ -f "build/usr/lib/libugc-zero.a" ]; then
            echo "✅ Build successful: libugc-zero.a created"
            ls -lh build/usr/lib/libugc-zero.a
            file build/usr/lib/libugc-zero.a
          else
            echo "❌ Build failed: libugc-zero.a not found"
            exit 1
          fi

      - name: Check object files
        run: |
          echo "Checking object files..."
          find build/usr/lib/objects/ugc-zero -name '*.obj' | tee objects.txt
          test -s objects.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ugc-riscv64-build
          path: |
            build/usr/lib/libugc-zero.a
            build/usr/lib/objects/ugc-zero/**
          retention-days: 7
