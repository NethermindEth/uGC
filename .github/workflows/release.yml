name: Release

# The workflow makes the tag: v<version>.<run>, as the zkVM packages of
# bflat make their versions (bflat-libziskos, bflat-sp1, bflat-openvm).
on:
  workflow_dispatch:
    inputs:
      version:
        description: uGC version (major.minor); the release is v<version>.<run>
        type: string
        default: "1.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect version
        id: version
        env:
          BASE: ${{ inputs.version }}
        run: |
          if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the version must be major.minor, not '$BASE'"
            exit 1
          fi
          version="v${BASE}.${GITHUB_RUN_NUMBER}"
          echo "Detected version $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      # A run that is run again keeps its run number, and with it the
      # version. Its release job would replace the files of the release
      # that has the version already. Start a new run instead.
      - name: Check that the release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ; then
            echo "::error::the release $VERSION exists already: start a new run"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker
        run: |
          chmod +x build.sh
          ./build.sh docker

      - name: Verify artifact
        run: |
          if [ -f "build/usr/lib/libugc-zero.a" ]; then
            echo "✅ Artifact found"
            ls -lh build/usr/lib/libugc-zero.a
          else
            echo "❌ Artifact not found"
            exit 1
          fi

      # The RV32IM build (Dockerfile.riscv32); it fails if the objects
      # carry a compressed, atomic or fence instruction.
      - name: Build riscv32 with Docker
        run: ./build.sh docker riscv32

      - name: Create archive
        run: |
          mkdir -p archive_tmp
          find build/usr -name "*.a" -exec cp {} archive_tmp/ \;
          find build/usr -name "*.obj" -exec cp {} archive_tmp/ \;
          tar -czf ugc-riscv64.tar.gz -C archive_tmp .
          rm -rf archive_tmp
          ls -lh ugc-riscv64.tar.gz
          mkdir -p archive_tmp
          cp build-riscv32/usr/lib/ugc.o archive_tmp/
          find build-riscv32/usr -name "*.obj" -exec cp {} archive_tmp/ \;
          tar -czf ugc-riscv32.tar.gz -C archive_tmp .
          rm -rf archive_tmp
          cp build-riscv32/usr/lib/ugc.o ugc-riscv32.o
          ls -lh ugc-riscv32.tar.gz ugc-riscv32.o

      # The release assets, and the list of their SHA-256 hashes for the
      # sign job (docs/signing.md in bflat-riscv64). This job has no key.
      # The release flattens the asset paths, so the list names each file by
      # its base name, and list-files refuses two files with one name.
      - name: List the release assets
        run: |
          mapfile -d '' objects < <(find build/usr/lib/objects/ugc-zero -name '*.obj' -print0)
          files=(build/usr/lib/libugc-zero.a ugc-riscv64.tar.gz ugc-riscv32.tar.gz ugc-riscv32.o "${objects[@]}")
          python3 tools/sign_package.py list-files signature "${files[@]}"
          mkdir release
          cp "${files[@]}" release/

      - name: Upload the release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

      - name: Upload the list
        uses: actions/upload-artifact@v4
        with:
          name: bflat-signature-lists
          path: signature/bflat-signature.sha256
          if-no-files-found: error

  # The private key is only in the sign job, which runs no build
  # (docs/signing.md in bflat-riscv64).
  sign:
    name: Sign the release assets
    needs: build
    permissions: {}
    uses: NethermindEth/bflat-riscv64/.github/workflows/sign.yml@34a3e73ad5b2f34a868f5793172dc4a3a97bf382 # master
    with:
      lists: bflat-signature-lists
    secrets:
      BFLAT_SIGNING_KEY: ${{ secrets.BFLAT_SIGNING_KEY }}

  release:
    name: Release
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: Download the signature
        uses: actions/download-artifact@v4
        with:
          name: bflat-signatures
          path: signature

      # The assets must agree with the list that was signed, and the
      # signature must be valid for the public key, before the release.
      - name: Check the signature
        env:
          BFLAT_SIGNING_PUBLIC_KEY: ${{ vars.BFLAT_SIGNING_PUBLIC_KEY }}
        run: python3 tools/sign_package.py check-files signature release/*

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # The commit that was built; the default is the head of the default branch.
          target_commitish: ${{ github.sha }}
          tag_name: ${{ needs.build.outputs.version }}
          name: Release ${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          files: |
            release/*
            signature/bflat-signature.sha256
            signature/bflat-signature.sha256.sig
          body: |
            ## uGC Release ${{ needs.build.outputs.version }}

            Lightweight Garbage Collector for .NET on RISC-V 64-bit

            ### Files
            - `libugc-zero.a` - Static library
            - `*.obj` - Individual object files (C++ wrappers and the formally verified C core)
            - `ugc-riscv64.tar.gz` - Complete archive with library and object files
            - `ugc-riscv32.o` - The RV32IM (ilp32) build as one relocatable object, for the Airbender guests of bflat
            - `ugc-riscv32.tar.gz` - `ugc-riscv32.o` and the RV32IM object files
            - `bflat-signature.sha256`, `bflat-signature.sha256.sig` - The signed SHA-256 list of the other files, which bflat checks

            ### Usage
            Link this library with your bflat RISC-V 64-bit projects.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
